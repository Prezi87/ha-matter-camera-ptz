name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax and card tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate card JavaScript syntax
        run: node --check custom_components/matter_camera_ptz/frontend/matter-camera-ptz-card.js
      - name: Test privacy-mode video recovery
        run: node --test tests/privacy_resume.test.cjs
      - name: Compile integration Python
        run: python -m compileall -q custom_components tools
      - name: Validate JSON and YAML
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import json, pathlib, yaml
          for p in pathlib.Path('.').rglob('*.json'):
              json.loads(p.read_text())
          for p in pathlib.Path('.').rglob('*.yaml'):
              yaml.safe_load(p.read_text())
          print('Syntax OK')
          PY
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Custom repository: topics require GitHub repository admin access.
          # Remove this ignore after setting topics in GitHub's About sidebar.
          ignore: topics
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
