# Example for RomRider custom:button-card.
# Replace the button entity with one generated by this integration.
# The example uses the same hold/release mechanism tested in the author's HA dashboard.
type: custom:button-card
icon: mdi:arrow-left-bold
show_name: false
aspect_ratio: 1/1
press_action:
  action: javascript
  javascript: |
    [[[
      this._ptzStarted = Date.now();
    ]]]
release_action:
  action: javascript
  javascript: |
    [[[
      const started = this._ptzStarted;
      this._ptzStarted = undefined;
      if (typeof started !== "number") return;
      const seconds = Math.max(0, (Date.now() - started) / 1000);
      const delta = Math.max(8, Math.min(90, Math.round(seconds * 30)));
      helpers.runAction({
        action: "perform-action",
        perform_action: "matter_camera_ptz.move",
        data: {
          entity_id: "button.matter_camera_pan_left", // REPLACE ME
          direction: "left",
          delta: delta
        }
      });
    ]]]
styles:
  card:
    - width: 64px
    - height: 64px
    - border-radius: 50%
    - padding: 0
    - box-shadow: none
