# Native Matter video + PTZ. Requires camera entity from the experimental branch.
# Replace camera.* and button.* with your HA entity IDs.
# Optional Aqara privacy helper is vendor-specific and managed separately in HA.
type: custom:matter-camera-ptz-card
title: Aqara G350
native_camera_entity: camera.REPLACE_WITH_MATTER_LIVE_CAMERA
ptz_entity: button.REPLACE_WITH_ACTUAL_PTZ_BUTTON
privacy_entity: input_boolean.g350_monitoring
# Recommended for Aqara G350: use the read-only live-view privacy status reported by Matter.
# Copy the real entity ID from HA > Settings > Devices & services > Matter Camera PTZ.
# Remove the comment marker after replacing the placeholder:
# privacy_status_entity: binary_sensor.YOUR_CAMERA_LIVE_VIEW_BLOCKED
privacy_resume_delay_ms: 1000
button_size: 62
gap: 8
pan_per_second: 30
pan_max: 90
tilt_per_second: 12
tilt_max: 24
zoom_delta: 5
zoom_repeat_ms: 3500
